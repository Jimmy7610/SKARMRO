name: Browser Guard Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/Skarmro.BrowserGuard/**"
      - "tests/browser-guard-rules.test.cjs"
      - ".github/workflows/browser-guard-tests.yml"
  pull_request:
    paths:
      - "src/Skarmro.BrowserGuard/**"
      - "tests/browser-guard-rules.test.cjs"
      - ".github/workflows/browser-guard-tests.yml"

jobs:
  browser-guard:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate manifest JSON
        shell: pwsh
        run: Get-Content src/Skarmro.BrowserGuard/manifest.json -Raw | ConvertFrom-Json | Out-Null

      - name: Check extension JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem src/Skarmro.BrowserGuard -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run Browser Guard rule tests
        run: node --test tests/browser-guard-rules.test.cjs

      - name: Run routine engine tests
        run: node --test tests/browser-guard-routines.test.cjs
