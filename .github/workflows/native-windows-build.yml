name: Native Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/Skarmro.GuardService/**"
      - "src/Skarmro.ParentApp/**"
      - "src/Skarmro.JuniorLauncher/**"
      - "scripts/native/**"
      - ".github/workflows/native-windows-build.yml"
  pull_request:
    paths:
      - "src/Skarmro.GuardService/**"
      - "src/Skarmro.ParentApp/**"
      - "src/Skarmro.JuniorLauncher/**"
      - "scripts/native/**"
      - ".github/workflows/native-windows-build.yml"

jobs:
  build-native:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect installed .NET SDKs
        shell: pwsh
        run: |
          dotnet --info
          $sdks = dotnet --list-sdks
          $sdks
          if (-not ($sdks -match "^10\.")) {
            throw ".NET 10 SDK is not preinstalled on this runner."
          }

      - name: Build Guard Service
        run: dotnet build src/Skarmro.GuardService/Skarmro.GuardService.csproj -c Release

      - name: Build Parent App
        run: dotnet build src/Skarmro.ParentApp/Skarmro.ParentApp.csproj -c Release

      - name: Build Junior Launcher
        run: dotnet build src/Skarmro.JuniorLauncher/Skarmro.JuniorLauncher.csproj -c Release

      - name: Parse native PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts\native\*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "Parser errors in $($_.FullName)"
              $errors | ForEach-Object { Write-Host $_.Message }
              $failed = $true
            } else {
              Write-Host "PASS $($_.Name)"
            }
          }

          if ($failed) {
            throw "One or more native PowerShell scripts contain parser errors."
          }
